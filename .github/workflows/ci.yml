name: Django CI and Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests, lint and coverage
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: github-actions-ci-only-not-for-production
      DATABASE_NAME: db.sqlite3
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt coverage ruff

      - name: Static analysis
        run: |
          python -m compileall -q api demo
          ruff check . --select E4,E7,E9,F63,F7,F82

      - name: Unit tests and coverage
        run: |
          coverage run --source=api manage.py test
          coverage report -m
          coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish on main
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/pedrojosetrueba/devsu-demo-devops-python:latest
            ghcr.io/pedrojosetrueba/devsu-demo-devops-python:${{ github.sha }}
