apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsu-api
  namespace: devsu
spec:
  ingressClassName: traefik
  rules:
    - host: devsu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsu-api
                port:
                  name: http
